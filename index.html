<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>회의실 예약</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="회의실 예약">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<script>window.SIOT_DEMO = true;</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/tokens.css?v=3f78436d">
<link rel="stylesheet" href="assets/components.css?v=b695712f">
<link rel="stylesheet" href="assets/app.css?v=616a19ef">
<link rel="stylesheet" href="assets/mobile.css?v=1b2e2fbe">
</head>
<body>

<!-- 아이콘 스프라이트 — 인라인 SVG 24px · stroke 1.6 · currentColor · 원형 배경 없음 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 15V10a6 6 0 10-12 0v5l-2 3h16l-2-3zM10 21h4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4M8 8h3v3H8zM13 13h3v3h-3z"/></symbol>
  <symbol id="i-light" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M12 17v4"/></symbol>
  <symbol id="i-temp" viewBox="0 0 24 24"><path d="M14 14V5a2 2 0 10-4 0v9a4 4 0 104 0z"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 11-12.8 0"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 01-12 0zM12 17v4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M12 10V7a4 4 0 00-8 0v3"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0"/></symbol>
  <symbol id="i-blind" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="4" rx="1"/><path d="M4 11h16M4 15h16M12 19v2"/></symbol>
  <symbol id="i-sensor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.5-5.8M20 4v4h-4"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13h4l1.5 3h5L16 13h4M4 13l2-8h12l2 8v6a1 1 0 01-1 1H5a1 1 0 01-1-1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8 8 0 00-6.9 4M4 4v4h4M12 8v4l3 2"/></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><path d="M14 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 8l-4 4 4 4M6 12h9"/></symbol>
  <symbol id="i-signal" viewBox="0 0 24 24"><path d="M4 18h2M9 14h2M14 10h2M19 6h2" stroke-width="2.4"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="9" rx="2"/><path d="M21 12v2"/></symbol>
  <symbol id="i-finger" viewBox="0 0 24 24"><path d="M12 3a6 6 0 016 6v3a9 9 0 01-1.5 5M8 20a12 12 0 001.5-6V9a2.5 2.5 0 015 0v5M6 16a9 9 0 01-.5-4 6.5 6.5 0 013-5.5"/></symbol>
  <symbol id="i-sign" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h6M7 14h4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.5 5.1 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></symbol>
</defs></svg>

<div class="device" id="device">

  <!-- 데스크톱 프레임에서만 보이는 기기 상태바 -->
  <div class="statusbar">
    <span id="statusTime" class="tnum"></span>
    <span class="statusbar__right">
      <svg class="icon" aria-hidden="true"><use href="#i-signal"/></svg>
      <svg class="icon" aria-hidden="true"><use href="#i-battery"/></svg>
    </span>
  </div>

  <div class="viewport" id="viewport">

    <!-- ══ S-05 홈 (탭 1) — 1b. 인디고 헤더에 오늘 일정, 아래 빈 공간 리스트 ══ -->
    <section class="screen" data-screen="S-05" aria-label="홈">
      <div id="homeHead"></div>
      <div class="screen__body" id="homeBody"></div>
      <div class="fixedcta" id="homeCta"></div>
    </section>

    <!-- ══ S-06 탐색 (탭 2) — 공간 그룹 · 시간 두 섹션 + 회의룸 카드 ══ -->
    <section class="screen" data-screen="S-06" aria-label="탐색">
      <header class="appbar">
        <span class="appbar__title">탐색<span id="findDate"></span></span>
        <span class="appbar__trail">
          <button class="iconbtn" data-go="S-24" aria-label="검색"><svg class="icon"><use href="#i-search"/></svg></button>
        </span>
      </header>
      <div class="screen__body" id="findBody"></div>
    </section>

    <!-- ══ S-16 내 예약 (탭 3) — 카드 목록. 카드를 누르면 제어 페이지 ══ -->
    <section class="screen" data-screen="S-16" aria-label="내 예약">
      <header class="appbar">
        <span class="appbar__title">내 예약<span id="mineCount"></span></span>
        <span class="appbar__trail">
          <button class="iconbtn" data-go="S-21" aria-label="알림"><svg class="icon"><use href="#i-bell"/></svg></button>
        </span>
      </header>
      <div class="segment pad" id="mineSeg"></div>
      <div class="screen__body" id="mineBody"></div>
    </section>

    <!-- ══ S-12 QR 체크인 — 문 앞 예약 현황판(사이니지)의 QR을 앱이 읽는다 (2026-09-22 · 리더기가 예약 QR을 읽던 구조를 뒤집음) ══ -->
    <section class="screen screen--scan" data-screen="S-12" aria-label="QR 체크인">
      <div class="scan__cam" data-scanhit></div>
      <header class="appbar appbar--scan">
        <button class="iconbtn iconbtn--scan" data-back aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
        <span class="appbar__title">QR 체크인</span>
      </header>
      <div class="scan__frame" data-scanhit><i></i><i></i><i></i><i></i></div>
      <p class="scan__hint" id="scanHint">문 앞 예약 현황판의 QR을 비추세요</p>
      <div class="scan__sheet" id="scanSheet"></div>
    </section>

    <!-- ══ S-14 제어 페이지 — 카드에서 열린다. 이용 중 / 입실 전 한 화면 ══ -->
    <section class="screen screen--board" data-screen="S-14" aria-label="공간 제어">
      <header class="appbar">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <span class="appbar__mid" id="ctlTop"></span>
        <span class="appbar__trail">
          <button class="iconbtn" id="ctlRsv" aria-label="예약 상세"><svg class="icon"><use href="#i-cal"/></svg></button>
        </span>
      </header>
      <div class="screen__body" id="ctlBody"></div>
    </section>

    <!-- ══ S-14b 제어 이력 ══ -->
    <section class="screen" data-screen="S-14b" aria-label="제어 이력">
      <header class="appbar appbar--line">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <span class="appbar__mid">제어 이력</span>
        <span class="appbar__trail" style="width:44px"></span>
      </header>
      <div class="screen__body" id="logBody"></div>
    </section>

    <!-- ══ S-15 예약 상세 ══ -->
    <section class="screen" data-screen="S-15" aria-label="예약 상세">
      <header class="appbar appbar--line">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <span class="appbar__mid">예약 상세</span>
        <span class="appbar__trail">
          <button class="iconbtn" id="rsvMore" aria-label="더보기"><svg class="icon"><use href="#i-more"/></svg></button>
        </span>
      </header>
      <div class="screen__body" id="rsvBody"></div>
      <div class="fixedcta" id="rsvCta"></div>
    </section>

    <!-- ══ S-24 검색 — 전체화면 모달이므로 좌상단 X ══ -->
    <section class="screen" data-screen="S-24" aria-label="검색">
      <header class="appbar">
        <button class="iconbtn closebtn" data-back aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
        <input class="searchinput" id="searchInput" type="search" placeholder="회의실 이름으로 찾기" aria-label="검색어">
      </header>
      <div class="screen__body" id="searchBody"></div>
    </section>

    <!-- ══ S-18 마이 (탭 4) ══ -->
    <section class="screen" data-screen="S-18" aria-label="마이">
      <header class="appbar">
        <span class="appbar__title">마이</span>
      </header>
      <div class="screen__body" id="myBody"></div>
    </section>

    <!-- ══ S-20 알림 설정 — 이 폰에서 울릴지만 정한다. 무엇을 보낼지는 관리자 web (2026-09-30 70차) ══ -->
    <section class="screen" data-screen="S-20" aria-label="알림 설정">
      <header class="appbar appbar--line">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <span class="appbar__mid">알림 설정</span>
        <span class="appbar__trail" style="width:44px"></span>
      </header>
      <div class="screen__body" id="notifySetBody"></div>
    </section>

    <!-- ══ S-21 알림함 ══ -->
    <section class="screen" data-screen="S-21" aria-label="알림함">
      <header class="appbar appbar--line">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
        <span class="appbar__mid">알림</span>
        <span class="appbar__trail" style="width:44px"></span>
      </header>
      <div class="screen__body" id="notifyBody"></div>
    </section>


    <!-- ══ S-01 스플래시 ══ -->
    <section class="screen" data-screen="S-01" aria-label="시작">
      <div class="splash">
        <span class="splash__mark" role="img" aria-label="SIOT"></span>   <!-- SIOT 로고 이미지(CSS 배경 · assets/brand) — 글자 워드마크 대신 (2026-10-01) -->
        <!-- 앱은 플랫폼이다 — 회사 상호가 아니라 서비스 이름만 (2026-09-30 72차 · 회사는 홈 헤더에서 고른다) -->
        <span class="splash__by">회의실 예약</span>
      </div>
    </section>

    <!-- ══ S-02 로그인 — 간편 로그인 4종 + 휴대폰 번호 (72차) ══ -->
    <section class="screen" data-screen="S-02" aria-label="로그인">
      <div class="screen__body" id="loginBody"></div>
    </section>

    <!-- ══ S-04 권한 안내 — 좌상단 X로 건너뛴다 ══ -->
    <section class="screen" data-screen="S-04" aria-label="권한 안내">
      <header class="appbar">
        <button class="iconbtn closebtn" data-skip aria-label="건너뛰기"><svg class="icon"><use href="#i-close"/></svg></button>
      </header>
      <div class="screen__body" id="permBody"></div>
      <div class="fixedcta"><button class="btn btn--primary" data-skip>시작하기</button></div>
    </section>

    <!-- ══ S-25 회사 추가 — 회사코드 → 사번 · 부서 · 직급 → 승인 대기 (72차) ══ -->
    <section class="screen" data-screen="S-25" aria-label="회사 추가">
      <header class="appbar">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
      </header>
      <div class="screen__body" id="joinCodeBody"></div>
      <div class="fixedcta"><button class="btn btn--primary" id="joinCodeGo">다음</button></div>
    </section>

    <!-- ══ S-26 회원가입 — 이름 · 휴대폰 번호 (+ 비밀번호) · 약관. 로그인 위에 쌓인다 (72차) ══ -->
    <section class="screen" data-screen="S-26" aria-label="회원가입">
      <header class="appbar">
        <button class="iconbtn" data-back aria-label="뒤로"><svg class="icon"><use href="#i-back"/></svg></button>
      </header>
      <div class="screen__body" id="joinFormBody"></div>
      <div class="fixedcta"><button class="btn btn--primary" id="joinGo">가입하기</button></div>
    </section>

    <!-- S-27 승인 대기는 없어졌다 — 가입과 회사 소속이 갈라져, 승인 대기는 홈의 카드 · 회사 시트 · 마이에서 보인다 (72차) -->

    <!-- ══ S-28 비밀번호 변경 — 휴대폰 번호로 가입한 계정만 (임시 비밀번호 강제 변경은 72차에 없어짐) ══ -->
    <section class="screen" data-screen="S-28" aria-label="비밀번호 변경">
      <header class="appbar" id="pwBar"></header>
      <div class="screen__body" id="pwBody"></div>
      <div class="fixedcta"><button class="btn btn--primary" id="pwGo">비밀번호 바꾸기</button></div>
    </section>

  </div>

  <!-- 화면 ID 라벨 (§18) — 앱 UI가 아니다. 기본 꺼짐 -->
  <div class="idlabel" id="idLabel" hidden></div>
  <!-- 스펙 오버레이 (§18) — 개발자 리뷰용. 기본 꺼짐 -->
  <div class="specovl" id="specOvl" hidden></div>

  <!-- 하단 탭 4개 -->
  <nav class="tabbar" id="tabbar" aria-label="주요 화면">
    <button class="tabbar__item" data-tab="S-05"><svg class="icon"><use href="#i-home"/></svg><span class="tabbar__label">홈</span></button>
    <button class="tabbar__item" data-tab="S-06"><svg class="icon"><use href="#i-search"/></svg><span class="tabbar__label">탐색</span></button>
    <!-- 가운데 체크인 — 탭이 아니라 동작 버튼(A안 · 2026-09-22). 활성 상태가 없고 검정이라 주황 CTA와 부딪히지 않는다 -->
    <button class="tabbar__scan" data-go="S-12" aria-label="QR 체크인"><span class="tabbar__ball"><svg class="icon"><use href="#i-qr"/></svg></span><span class="tabbar__label">체크인</span></button>
    <button class="tabbar__item" data-tab="S-16"><svg class="icon"><use href="#i-cal"/></svg><span class="tabbar__label">내 예약</span></button>
    <button class="tabbar__item" data-tab="S-18"><svg class="icon"><use href="#i-user"/></svg><span class="tabbar__label">마이</span></button>
  </nav>

  <!-- 데스크톱 프레임에서만 보이는 홈 인디케이터 -->
  <div class="homebar"></div>

  <!-- 바텀시트 — 우상단 X · 스크림 탭 · ESC · 드래그 다운 -->
  <div class="sheetlayer" id="sheetLayer">
    <div class="scrim" data-close></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__handle" id="sheetHandle"></div>
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheetTitle"></h2>
        <button class="iconbtn" data-close aria-label="닫기"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet__body" id="sheetBody"></div>
      <div class="fixedcta" id="sheetCta" hidden></div>
    </div>
  </div>

  <!-- 토스트 — 3초 -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast__text" id="toastText"></span>
    <button class="toast__action" id="toastAction" hidden></button>
  </div>

</div>

<!-- ═══ 프로토타입 전용 도구 (§18) ═══════════════════════════
     폰 프레임 바깥. 데스크톱에서만 보이고 모든 값이 기본 꺼짐.
     전부 꺼도 화면을 그대로 쓸 수 있어야 한다 (원칙 07) -->
<aside class="tools" id="tools" aria-label="프로토타입 도구">
  <p class="tools__h">프로토타입 도구</p>

  <div class="tools__g">
    <span class="tools__k">화면 ID</span>
    <button class="tools__b" data-tool="id" data-val="off">숨김</button>
    <button class="tools__b" data-tool="id" data-val="on">표시</button>
  </div>

  <div class="tools__g">
    <span class="tools__k">홈 상태</span>
    <button class="tools__b" data-tool="home" data-val="live">진행중 있음</button>
    <button class="tools__b" data-tool="home" data-val="soon">입실 대기</button>
    <button class="tools__b" data-tool="home" data-val="none">예약 없음</button>
  </div>


  <div class="tools__g">
    <span class="tools__k">기기</span>
    <button class="tools__b" data-tool="dev" data-val="ok">정상</button>
    <button class="tools__b" data-tool="dev" data-val="partial">일부 오프라인</button>
  </div>

  <div class="tools__g">
    <span class="tools__k">QR 인식 (S-12)</span>
    <button class="tools__b" data-tool="reader" data-val="success">인식 성공</button>
